# PAT9125EL を X/Y の相対移動（カーソル）として使う入力ドライバ
#
# Zephyr 標準の pixart,pat912x と同じレジスタ操作だが、次の点を変えている
#   - 初期化時にソフトウェアリセットをしない
#   - MOTION をエッジではなくレベル割り込みで検出し、MOTION が出ている間は
#     一定間隔で読み続ける（エッジの取りこぼしで止まらないようにする）
# 割り込みとリセットの扱いは zmk-driver-hires-dial に合わせている

description: PAT9125EL optical navigation chip as a relative X/Y input device

compatible: "pixart,pat9125-zmk"

include: i2c-device.yaml

properties:
  motion-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the active-low MOTION output.

  res-x-cpi:
    type: int
    default: 1275
    description: X resolution in CPI (0-1275, 5 CPI steps).

  res-y-cpi:
    type: int
    default: 1275
    description: Y resolution in CPI (0-1275, 5 CPI steps).

  invert-x:
    type: boolean
    description: Invert X axis.

  invert-y:
    type: boolean
    description: Invert Y axis.

  swap-xy:
    type: boolean
    description: Swap X and Y axes (applied before inversion).

  motion-read-interval-ms:
    type: int
    default: 8
    description: Delay between reads while MOTION stays asserted.

  sleep1-enable:
    type: boolean
    description: Enable sensor sleep1 mode.

  sleep2-enable:
    type: boolean
    description: Enable sensor sleep2 mode (requires sleep1-enable).
