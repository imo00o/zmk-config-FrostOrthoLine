manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: sekigon-gonnoc  # hires-dial
      url-base: https://github.com/sekigon-gonnoc
    - name: kot149  # マウスジェスチャー
      url-base: https://github.com/kot149
  projects:
    # ZMK main (Zephyr 4.1) + DYA Studio 対応の cormoran 版
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
    - name: zmk-driver-hires-dial
      remote: sekigon-gonnoc
      revision: master
    - name: zmk-mouse-gesture
      remote: kot149
      revision: v2
    # DYA Studio モジュール
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
  self:
    path: config
