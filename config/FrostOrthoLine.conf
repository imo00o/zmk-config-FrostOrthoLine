# ========================================
# FrostOrthoLine 共通設定（ダイヤル版・PAT9125 トラックボール版の両方で読み込まれる）
# シールド別の設定は boards/shields/FrostOrthoLine/<シールド名>.conf
# ========================================

# ========================================
# 基本設定
# ========================================
CONFIG_ZMK_KEYBOARD_NAME="FrostOrthoLine"
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_BLE=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_INPUT=y
# PAW3222 ドライバ（default が無いので明示的に有効化が必要）
CONFIG_PAW3222=y
# NFC ピン(COL1/COL5)の GPIO 化は Zephyr 4.x ではデバイスツリー(&uicr)で設定している

# Zephyr 4.1 ではデフォルトで有効だが不要
CONFIG_CONSOLE=n

# Bluetooth接続設定
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ========================================
# Battery
# ========================================
# ROW1 が D16(P0.31/AIN7) に配線されているが、このピンは XIAO 内蔵の
# バッテリー電圧分圧回路の ADC 入力と同じピン。ROW1 のプルダウンで電圧が
# 正しく読めないため、バッテリーレポートは無効化する。
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_BT_BAS=n
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y

# ========================================
# ZMK Studio（必須ベース）
# ========================================
CONFIG_ZMK_STUDIO=y
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n を設定しないでください。

# ========================================
# DYA Studio モジュール
# ========================================
# BLE 管理 https://github.com/cormoran/zmk-module-ble-management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Settings RPC（アイドル/スリープ設定） https://github.com/cormoran/zmk-module-settings-rpc
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Runtime Input Processor https://github.com/cormoran/zmk-module-runtime-input-processor
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Custom Settings（コンボの保存先） https://github.com/cormoran/zmk-feature-custom-settings
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

# コンボ（DYA Studio から編集） https://github.com/cormoran/zmk-feature-runtime-combo
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# ========================================
# Custom RPC 用のバッファ・スタック調整（DYA2 の設定に準拠）
# ========================================
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# ========================================
# 設定の永続化
# ========================================
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
