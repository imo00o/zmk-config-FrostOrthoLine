name: Build ZMK Firmware

on:
  push:
    paths:
      - 'config/**'
      - 'boards/**'
      - 'build.yaml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'zephyr/**'
      - 'src/**'
      - 'dts/**'
  pull_request:
    paths:
      - 'config/**'
      - 'boards/**'
      - 'build.yaml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'zephyr/**'
      - 'src/**'
      - 'dts/**'
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
